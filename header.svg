<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Hi, I'm Zak — Full-Stack Developer">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9f">
        <animate attributeName="stop-color" values="#00ff9f;#00e5ff;#00ff9f" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#00ff9f;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#00ff9f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff9f" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="300" fill="#0d1117"/>
  <rect width="900" height="300" fill="url(#grid)"/>

  <ellipse cx="450" cy="140" rx="380" ry="130" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#00ff9f">
    <circle cx="120" cy="70" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="760" cy="90" r="2.5">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="200" cy="230" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="680" cy="220" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="90" cy="150" r="2.5">
      <animate attributeName="opacity" values="0;1;0" dur="3.8s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="830" cy="180" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="430" cy="40" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="4.2s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
    <circle cx="560" cy="255" r="2.5">
      <animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <text x="40" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3fb950" opacity="0.85">$ whoami</text>

  <text x="40" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="68" font-weight="700" fill="url(#titleGrad)">Hi, I'm Zak</text>

  <text x="42" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8b949e">full-stack developer · AI · web · devtools</text>

  <text x="40" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#00ff9f" opacity="0.9">$ always shipping</text>
  <rect x="232" y="241" width="10" height="17" fill="#00ff9f">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
